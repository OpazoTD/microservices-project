services:
  # Bases de datos (Se mantienen igual, solo verificamos nombres)
  postgres:
    image: postgres:16
    container_name: ms-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: usuarios_db
    ports:
      - "5433:5432"
    networks:
      - ms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d usuarios_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: ms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: productos_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    ports:
      - "3307:3306"
    networks:
      - ms-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-padmin123"]
      interval: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: ms-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27018:27017"
    networks:
      - ms-network
    healthcheck:
      test: ["CMD", "mongosh", "-u", "admin", "-p", "admin123", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 5

  # Microservicios con puertos TCP corregidos
  usuarios-ms:
    build: ./backend/usuarios-ms
    container_name: ms-usuarios
    environment:
      DATABASE_URL: "postgresql://admin:admin123@postgres:5432/usuarios_db"
      NODE_ENV: production
    ports:
      - "3001:3001"  
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - ms-network

  productos-ms:
    build: ./backend/productos-ms
    container_name: ms-productos
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: admin
      DB_PASSWORD: admin123
      DB_DATABASE: productos_db
      PORT: 3002
      MS_TCP_PORT: 3004
      NODE_ENV: production
    ports:
      - "3002:3002"
      - "3004:3004"
    depends_on:
      mysql: { condition: service_healthy }
    networks:
      - ms-network

  facturas-ms:
      build: ./backend/facturas-ms
      container_name: ms-facturas
      environment:
        DATABASE_URL: "mongodb://admin:admin123@mongodb:27017/facturas_db?authSource=admin"
        PRODUCTOS_MS_HOST: productos-ms
        TCP_PORT: 3003
        NODE_ENV: production
      ports:
        - "3003:3003"
      depends_on:
        mongodb: 
          condition: service_healthy
      networks:
        - ms-network


  gateway:
    build: ./backend/api-gateway
    container_name: ms-gateway
    ports:
      - "3000:3000"
    environment:
      MS_USER_HOST: usuarios-ms
      MS_USER_PORT: 3001
      MS_PRODUCT_HOST: productos-ms
      MS_PRODUCT_PORT: 3004  
      MS_INVOICE_HOST: facturas-ms
      MS_INVOICE_PORT: 3003  
      JWT_SECRET: "tu_clave_super_secreta"
    depends_on:
      - usuarios-ms
      - productos-ms
      - facturas-ms
    networks:
      - ms-network

networks:
  ms-network:
    driver: bridge