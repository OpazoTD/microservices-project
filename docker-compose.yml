services:
  # Bases de datos (Se mantienen igual, solo verificamos nombres)
  postgres:
    image: postgres:16
    container_name: ms-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-usuarios_db}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5433}:5432"
    networks:
      - ms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-usuarios_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: ms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-productos_db}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-admin123}
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3307}:3306"
    networks:
      - ms-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: ms-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_EXTERNAL_PORT:-27018}:27017"
    networks:
      - ms-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 5

  mongo-init:
    image: mongo:7.0
    container_name: ms-mongodb-init
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      sh -c "mongosh --host mongodb:27017 --quiet --eval
      \"try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members:[{ _id:0, host:'mongodb:27017'}]}) }\""
    networks:
      - ms-network
    restart: "no"

  # Microservicios con puertos TCP corregidos
  usuarios-ms:
    build: ./backend/usuarios-ms
    container_name: ms-usuarios
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/${POSTGRES_DB:-usuarios_db}"
      NODE_ENV: ${NODE_ENV:-production}
      AUTO_SEED_ADMIN: ${AUTO_SEED_ADMIN:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@correo.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
    ports:
      - "${USUARIOS_EXTERNAL_PORT:-3001}:3001"
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - ms-network

  productos-ms:
    build: ./backend/productos-ms
    container_name: ms-productos
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-admin}
      DB_PASSWORD: ${MYSQL_PASSWORD:-admin123}
      DB_DATABASE: ${MYSQL_DATABASE:-productos_db}
      PORT: ${PRODUCTOS_HTTP_PORT:-3002}
      MS_TCP_PORT: ${PRODUCTOS_TCP_PORT:-3004}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "${PRODUCTOS_HTTP_PORT:-3002}:3002"
      - "${PRODUCTOS_TCP_PORT:-3004}:3004"
    depends_on:
      mysql: { condition: service_healthy }
    networks:
      - ms-network

  facturas-ms:
      build: ./backend/facturas-ms
      container_name: ms-facturas
      environment:
        DATABASE_URL: "mongodb://mongodb:27017/facturas_db?replicaSet=rs0"
        PRODUCTOS_MS_HOST: productos-ms
        TCP_PORT: ${FACTURAS_TCP_PORT:-3003}
        NODE_ENV: ${NODE_ENV:-production}
      ports:
        - "${FACTURAS_TCP_PORT:-3003}:3003"
      depends_on:
        mongodb: 
          condition: service_healthy
        mongo-init:
          condition: service_completed_successfully
      networks:
        - ms-network


  gateway:
    build: ./backend/api-gateway
    container_name: ms-gateway
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      MS_USER_HOST: usuarios-ms
      MS_USER_PORT: 3001
      MS_PRODUCT_HOST: productos-ms
      MS_PRODUCT_PORT: 3004  
      MS_INVOICE_HOST: facturas-ms
      MS_INVOICE_PORT: 3003  
      JWT_SECRET: ${JWT_SECRET:-tu_clave_super_secreta}
    depends_on:
      - usuarios-ms
      - productos-ms
      - facturas-ms
    networks:
      - ms-network

networks:
  ms-network:
    driver: bridge